name: Mettre le serveur en ligne (Cloudflare)
on:
  workflow_dispatch:
  push:
    paths: ['server/**', '.github/workflows/server.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Vérification du code
        run: npx tsc --noEmit
      - name: Vérification des secrets
        run: |
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do [ -n "${!s}" ] || { echo "❌ Secret $s manquant"; exit 1; }; done
          [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ] || { echo "❌ Secret ANTHROPIC_API_KEY manquant"; exit 1; }
          [ -n "${{ secrets.OPENAI_API_KEY }}" ] || { echo "❌ Secret OPENAI_API_KEY manquant"; exit 1; }
          echo "✅ Les 4 secrets sont présents"
      - name: Espace de stockage des compteurs (KV)
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ID=$(curl -s -H "$AUTH" "$API/storage/kv/namespaces?per_page=100" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);if(!j.success){console.error(JSON.stringify(j.errors));process.exit(1)}const n=j.result.find(x=>x.title==='matinal-quota');console.log(n?n.id:'')})")
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{"title":"matinal-quota"}' "$API/storage/kv/namespaces" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);if(!j.success){console.error(JSON.stringify(j.errors));process.exit(1)}console.log(j.result.id)})")
          fi
          echo "KV : $ID"; sed -i "s/__KV_ID__/$ID/" wrangler.toml
      - name: Adresse workers.dev
        id: sub
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).result?.subdomain||'')}catch{console.log('')}})")
          if [ -z "$SUB" ]; then
            SUB="matinal-$(echo $CLOUDFLARE_ACCOUNT_ID | cut -c1-6)"
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d "{\"subdomain\":\"$SUB\"}" $API | head -c 400; echo
          fi
          echo "sub=$SUB" >> $GITHUB_OUTPUT
      - name: Mise en ligne
        run: npx wrangler deploy
      - name: Clés secrètes du serveur
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node -e "console.log(JSON.stringify({ANTHROPIC_API_KEY:process.env.ANTHROPIC_API_KEY,OPENAI_API_KEY:process.env.OPENAI_API_KEY}))" | npx wrangler secret bulk
      - name: Test complet avec les vraies clés
        run: |
          URL="https://matinal-api.${{ steps.sub.outputs.sub }}.workers.dev"
          echo "ADRESSE DU SERVEUR : $URL"; echo "### Serveur : $URL" >> $GITHUB_STEP_SUMMARY
          sleep 10
          node smoke.mjs "$URL"
