name: Test du journal (vraies sources)
on:
  workflow_dispatch:
  push:
    paths: ['src/sources/**', 'src/journal/**', 'scripts/test-journal.ts', '.github/workflows/sources.yml']
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx --yes tsx scripts/test-journal.ts
